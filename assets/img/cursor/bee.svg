<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="body" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#fff6b0"/><stop offset=".35" stop-color="#ffd23f"/><stop offset=".8" stop-color="#f2a100"/><stop offset="1" stop-color="#c97a00"/>
    </radialGradient>
    <radialGradient id="head" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#5a5a5a"/><stop offset=".55" stop-color="#1c1c1c"/><stop offset="1" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset="1" stop-color="#bfe3ff" stop-opacity=".65"/>
    </linearGradient>
    <clipPath id="clip"><ellipse cx="0" cy="0" rx="17" ry="12.5"/></clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="1.2" dy="2" stdDeviation="1.4" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- antennae -->
    <path d="M13 13 Q8 11 3.5 10" fill="none" stroke="#1c1c1c" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M13 13 Q11 8 10 3.5" fill="none" stroke="#1c1c1c" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="3.5" cy="10" r="1.8" fill="#1c1c1c"/><circle cx="10" cy="3.5" r="1.8" fill="#1c1c1c"/>
    <!-- back wing -->
    <ellipse cx="0" cy="0" rx="10" ry="6" transform="translate(40 21) rotate(-20)" fill="url(#wing)" stroke="#8fb9d9" stroke-width=".8"/>
    <!-- body -->
    <g transform="translate(36 36) rotate(45)">
      <ellipse cx="0" cy="0" rx="17" ry="12.5" fill="url(#body)" stroke="#8a5200" stroke-width="1"/>
      <g clip-path="url(#clip)" fill="#1f1300" opacity=".9">
        <rect x="-3" y="-14" width="4.6" height="28"/>
        <rect x="6" y="-14" width="4.4" height="28"/>
      </g>
      <path d="M17 0 L20 0" stroke="#3a2600" stroke-width="2.4" stroke-linecap="round"/>
      <ellipse cx="-6" cy="-6" rx="6" ry="2.6" fill="#fff" opacity=".55"/>
    </g>
    <!-- head -->
    <circle cx="18" cy="18" r="8.5" fill="url(#head)"/>
    <circle cx="15.2" cy="15.6" r="2.4" fill="#fff"/><circle cx="15.6" cy="16" r="1.1" fill="#000"/>
    <circle cx="14.6" cy="14.9" r=".6" fill="#fff"/>
    <!-- front wing -->
    <ellipse cx="0" cy="0" rx="11" ry="6.5" transform="translate(45 27) rotate(-35)" fill="url(#wing)" stroke="#8fb9d9" stroke-width=".8"/>
    <ellipse cx="0" cy="0" rx="5" ry="1.6" transform="translate(42 25) rotate(-35)" fill="#fff" opacity=".8"/>
  </g>
</svg>
