<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF8F3" />
    <meta name="description" content="Velora — Electric Vehicle Companion App. Every journey, intelligently powered." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Velora</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var p = JSON.parse(localStorage.getItem('velora:state') || '{}').theme || 'system';
        var dark = p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
