<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Purrly — Fresh Food for Happy Cats</title>
    <meta
      name="description"
      content="Fresh, vet-approved cat food made with real meat. Delivered to your door."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="page">
      <section class="hero" aria-labelledby="hero-title">
        <header class="nav">
          <a class="brand" href="#" aria-label="Purrly home">
            <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
              <path
                d="M6 4l6 6h8l6-6v13a10 10 0 0 1-10 10A10 10 0 0 1 6 17z"
                fill="currentColor"
              />
              <circle cx="12" cy="16" r="1.8" fill="#fff" />
              <circle cx="20" cy="16" r="1.8" fill="#fff" />
            </svg>
            Purrly
          </a>

          <button class="nav__toggle" aria-expanded="false" aria-controls="nav-menu">
            <span class="sr-only">Toggle menu</span>
            <span></span><span></span>
          </button>

          <nav id="nav-menu" class="nav__menu">
            <a href="#">Recipes</a>
            <a href="#">Shop</a>
            <a href="#">Subscriptions</a>
            <a href="#">About Us</a>
            <a href="#">Login</a>
            <a class="btn btn--dark btn--sm" href="#">Shop Now <span aria-hidden="true">→</span></a>
          </nav>
        </header>

        <div class="hero__copy">
          <h1 id="hero-title">
            Happy Bellies,<br />
            Purrfect Lives.
          </h1>
          <p>
            Fresh, vet-approved meals made with real meat — so every cat can enjoy
            every bite of all nine lives.
          </p>
          <div class="hero__actions">
            <a class="btn btn--dark" href="#">Shop Now <span aria-hidden="true">→</span></a>
            <a class="btn btn--light" href="#">
              <span class="btn__avatar" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <ellipse cx="12" cy="16" rx="5" ry="4" />
                  <ellipse cx="5.5" cy="10" rx="2.2" ry="2.8" />
                  <ellipse cx="18.5" cy="10" rx="2.2" ry="2.8" />
                  <ellipse cx="9" cy="5.5" rx="2.2" ry="2.8" />
                  <ellipse cx="15" cy="5.5" rx="2.2" ry="2.8" />
                </svg>
              </span>
              Explore Recipes
            </a>
          </div>
        </div>

        <div id="cat-stage" class="hero__stage">
          <div class="hero__art">
            <img
              src="/hero-cats.webp"
              alt="A happy crowd of animated cats squeezing together for a selfie"
              width="1536"
              height="864"
              fetchpriority="high"
              draggable="false"
            />
          </div>
        </div>
        <p class="hero__hint" aria-hidden="true">Psst… try petting one 🐾</p>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
