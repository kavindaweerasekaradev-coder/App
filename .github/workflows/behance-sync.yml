name: Sync Behance projects

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: behance-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Import projects from Behance
        run: python3 scripts/sync_behance.py

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain assets/data assets/img/behance)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data assets/img/behance
          git commit -m "Sync Behance projects"
          git push
