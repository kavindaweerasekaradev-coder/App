name: Fetch Dribbble shots

# Runs when the Dribbble script changes on a claude/ branch (or on demand) and commits
# the shots back to that branch for review.
on:
  push:
    branches: ["claude/**"]
    paths: ["scripts/fetch_dribbble.mjs", ".github/workflows/fetch-dribbble.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-dribbble-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Fetch shots
        run: node scripts/fetch_dribbble.mjs https://dribbble.com/Kavindalakmal

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain assets/data/dribbble-raw)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/dribbble-raw
          git commit -m "Fetch Dribbble shots"
          git push origin HEAD:${{ github.ref_name }}
